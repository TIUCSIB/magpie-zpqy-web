<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="w-title w-desc">
  <title id="w-title">登录方式与请求链路</title>
  <desc id="w-desc">三种登录方式(浏览器授权 CDP 读 cookie、游客一键、粘贴 Cookie)汇入同一账号体系; 请求经本地 magpie 网关统一转 OpenAI 格式后由插件签名转发到清言。</desc>

  <defs>
    <marker id="warr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4B93FC"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="26" fill="#0B1220"/>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="25.5" fill="none" stroke="#16233C"/>

  <text x="64" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#F2F7FF">登录与请求链路</text>
  <text x="64" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#7E94B4">三条登录路径汇入同一账号体系, 之后走同一条签名转发链</text>

  <!-- three login cards -->
  <g transform="translate(64 116)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect width="340" height="120" rx="14" fill="#101A2C" stroke="#26436E"/>
      <rect x="20" y="20" width="8" height="80" rx="4" fill="#4B93FC"/>
      <text x="44" y="46" font-size="21" font-weight="600" fill="#D7E5F8">浏览器授权 · 推荐</text>
      <text x="44" y="74" font-size="17" fill="#8FA6C4">插件拉起专属 Chrome/Edge 窗口</text>
      <text x="44" y="98" font-size="17" fill="#8FA6C4">扫码登录 → CDP 读 token 即完成</text>
    </g>
    <g transform="translate(364 0)">
      <rect width="340" height="120" rx="14" fill="#101A2C" stroke="#26436E"/>
      <rect x="20" y="20" width="8" height="80" rx="4" fill="#3D7BF0"/>
      <text x="44" y="46" font-size="21" font-weight="600" fill="#D7E5F8">游客一键</text>
      <text x="44" y="74" font-size="17" fill="#8FA6C4">零输入领 guest token</text>
      <text x="44" y="98" font-size="17" fill="#8FA6C4">免费额度小, 适合尝鲜</text>
    </g>
    <g transform="translate(728 0)">
      <rect width="340" height="120" rx="14" fill="#101A2C" stroke="#26436E"/>
      <rect x="20" y="20" width="8" height="80" rx="4" fill="#C9A86A"/>
      <text x="44" y="46" font-size="21" font-weight="600" fill="#D7E5F8">粘贴 Cookie</text>
      <text x="44" y="74" font-size="17" fill="#8FA6C4">F12 复制 chatglm_token</text>
      <text x="44" y="98" font-size="17" fill="#8FA6C4">任意环境可用的兜底</text>
    </g>
  </g>

  <!-- converge arrows -->
  <g transform="translate(0 244)">
    <line x1="234" y1="8" x2="560" y2="52" stroke="#31517E" stroke-width="2" marker-end="url(#warr)"/>
    <line x1="604" y1="8" x2="604" y2="52" stroke="#31517E" stroke-width="2" marker-end="url(#warr)"/>
    <line x1="974" y1="8" x2="648" y2="52" stroke="#31517E" stroke-width="2" marker-end="url(#warr)"/>
  </g>

  <!-- pipeline -->
  <g transform="translate(64 306)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect width="252" height="88" rx="14" fill="#101A2C" stroke="#26436E"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#D7E5F8">任意客户端</text>
      <text x="20" y="64" font-size="16" fill="#7E94B4">Claude Code / 网页 / 脚本</text>
    </g>
    <g transform="translate(252 44)">
      <line x1="12" y1="0" x2="40" y2="0" stroke="#4B93FC" stroke-width="2" marker-end="url(#warr)"/>
    </g>
    <g transform="translate(304 0)">
      <rect width="252" height="88" rx="14" fill="#101A2C" stroke="#26436E"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#D7E5F8">magpie 网关</text>
      <text x="20" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7E94B4">127.0.0.1:3425</text>
    </g>
    <g transform="translate(556 44)">
      <line x1="12" y1="0" x2="40" y2="0" stroke="#4B93FC" stroke-width="2" marker-end="url(#warr)"/>
    </g>
    <g transform="translate(608 0)">
      <rect width="252" height="88" rx="14" fill="#0E1B33" stroke="#3D7BF0" stroke-width="1.5"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#9CC4F8">本插件</text>
      <text x="20" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7E94B4">x-sign 签名 + SSE 翻译</text>
    </g>
    <g transform="translate(860 44)">
      <line x1="12" y1="0" x2="40" y2="0" stroke="#4B93FC" stroke-width="2" marker-end="url(#warr)"/>
    </g>
    <g transform="translate(912 0)">
      <rect width="156" height="88" rx="14" fill="#101A2C" stroke="#26436E"/>
      <text x="20" y="38" font-size="20" font-weight="600" fill="#D7E5F8">智谱清言</text>
      <text x="20" y="64" font-size="16" fill="#7E94B4">chatglm.cn</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">智谱清言 · magpie/OpenCode 供应商插件</title>
  <desc id="h-desc">把 chatglm.cn 网页版接入本地 AI 网关: 请求经插件签名(x-sign)与协议翻译, 转发到清言对话接口, 再把 SSE 流转回 OpenAI Chat Completions 格式。</desc>

  <defs>
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FB1FF"/>
      <stop offset="1" stop-color="#3D7BF0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4B93FC"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" rx="26" fill="#0B1220"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="25.5" fill="none" stroke="#16233C"/>

  <!-- title block -->
  <g transform="translate(64 52)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5F7FA6" letter-spacing="2.5">MAGPIE · OPENCODE PROVIDER PLUGIN</text>

    <!-- qingyan swirl motif -->
    <g transform="translate(0 44)">
      <circle cx="30" cy="30" r="29" fill="none" stroke="url(#swirl)" stroke-width="2.5"/>
      <path d="M30 8 a22 22 0 1 1 -21.5 16.5" fill="none" stroke="url(#swirl)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="12" cy="42" r="5.5" fill="#6FB1FF"/>
    </g>
    <text x="82" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="700" fill="#F2F7FF">智谱清言</text>

    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#B9CDE8">chatglm.cn 网页协议 · 本地网关反代</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#7E94B4">签名逆向 · SSE 翻译 · 多轮会话映射 · 积分用量</text>

    <!-- meta chips -->
    <g transform="translate(0 216)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">
      <g>
        <rect x="0" y="0" width="128" height="34" rx="17" fill="#12203A" stroke="#26436E"/>
        <text x="64" y="22.5" text-anchor="middle" fill="#8FB4E8">3 种登录方式</text>
      </g>
      <g transform="translate(140 0)">
        <rect x="0" y="0" width="120" height="34" rx="17" fill="#12203A" stroke="#26436E"/>
        <text x="60" y="22.5" text-anchor="middle" fill="#8FB4E8">2 个模型</text>
      </g>
      <g transform="translate(272 0)">
        <rect x="0" y="0" width="128" height="34" rx="17" fill="#12203A" stroke="#26436E"/>
        <text x="64" y="22.5" text-anchor="middle" fill="#8FB4E8">3 档推理</text>
      </g>
      <g transform="translate(412 0)">
        <rect x="0" y="0" width="96" height="34" rx="17" fill="#12203A" stroke="#26436E"/>
        <text x="48" y="22.5" text-anchor="middle" fill="#8FB4E8">MIT</text>
      </g>
    </g>
  </g>

  <!-- proof: request translation pipeline -->
  <g transform="translate(708 44)">
    <rect x="0" y="0" width="428" height="312" rx="18" fill="#101A2C" stroke="#1E3252"/>
    <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#5F7FA6" letter-spacing="1.5">REQUEST LIFECYCLE</text>

    <!-- OpenAI in -->
    <g transform="translate(24 52)">
      <rect width="380" height="52" rx="10" fill="#0D1626" stroke="#22375A"/>
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#D7E5F8">OpenAI Chat Completions</text>
      <text x="16" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6E8DB4">POST /v1/chat/completions</text>
    </g>

    <!-- down arrow -->
    <g transform="translate(214 112)">
      <line x1="0" y1="4" x2="0" y2="30" stroke="#4B93FC" stroke-width="2" marker-end="url(#arr)"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#7E94B4">会话映射 · 协议翻译</text>
    </g>

    <!-- plugin core -->
    <g transform="translate(24 150)">
      <rect width="380" height="76" rx="10" fill="#0E1B33" stroke="#3D7BF0" stroke-width="1.5"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#9CC4F8">opencode-chatglm-auth</text>
      <text x="16" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9A86A">x-sign = md5(ts · nonce · salt)</text>
      <text x="16" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6E8DB4">luhn(Date.now()) · uuid32()</text>
    </g>

    <!-- up arrow -->
    <g transform="translate(214 234)">
      <line x1="0" y1="30" x2="0" y2="4" stroke="#4B93FC" stroke-width="2" marker-end="url(#arr)"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#7E94B4">SSE → chunk 流</text>
    </g>

    <!-- qingyan out -->
    <g transform="translate(24 272)">
      <rect width="380" height="30" rx="10" fill="#0D1626" stroke="#22375A"/>
      <text x="16" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6E8DB4">智谱清言 · /backend-api/assistant/stream</text>
    </g>
  </g>

  <text x="64" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#46618A">github.com/TIUCSIB/magpie-zpqy-web</text>
</svg>
